<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>여행가자! - 숙소 가격비교</title>
<style>
:root {
  --primary: #FF6B6B;
  --primary-dark: #EE5A5A;
  --primary-light: #FF8E8E;
  --accent: #FFE066;
  --mint: #A0E8D2;
  --sky: #87CEEB;
  --lavender: #C4B5FD;
  --peach: #FFDAB9;
  --bg: #FFF9F5;
  --card-bg: #FFFFFF;
  --text: #3D3D3D;
  --text-secondary: #8E8E8E;
  --border: #F0E6E0;
  --shadow: 0 2px 8px rgba(255,107,107,.08), 0 1px 3px rgba(0,0,0,.04);
  --shadow-lg: 0 8px 24px rgba(255,107,107,.12), 0 4px 8px rgba(0,0,0,.04);
  --radius: 16px;
  --radius-sm: 10px;
  --transition: .2s ease;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans KR', sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.6;
  min-height: 100vh;
}
a { color: inherit; text-decoration: none; }

/* ========== HEADER ========== */
.header {
  background: linear-gradient(135deg, #FF9A9E 0%, #FECFEF 40%, #FFF0C8 70%, #A0E8D2 100%);
  color: #3D3D3D;
  padding: 0;
  position: sticky;
  top: 0;
  z-index: 100;
  box-shadow: 0 3px 16px rgba(255,154,158,.25);
}
.header-inner {
  max-width: 1200px;
  margin: 0 auto;
  padding: 14px 24px 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.logo {
  font-size: 30px;
  font-weight: 900;
  letter-spacing: -0.5px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.logo-emoji { font-size: 32px; animation: bounce 2s ease infinite; }
@keyframes bounce {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-4px); }
}
.logo span { color: var(--primary); }
.header-sub {
  font-size: 13px;
  color: #7A6B6B;
  margin-top: 1px;
}

/* Tab bar */
.tab-bar {
  max-width: 1200px;
  margin: 0 auto;
  padding: 10px 24px 0;
  display: flex;
  gap: 6px;
}
.tab-btn {
  background: rgba(255,255,255,.45);
  color: #6B5B5B;
  border: none;
  padding: 10px 28px;
  border-radius: 14px 14px 0 0;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
  transition: all var(--transition);
}
.tab-btn:hover { background: rgba(255,255,255,.7); }
.tab-btn.active { background: var(--bg); color: var(--primary); }

/* ========== SEARCH BOX ========== */
.search-section {
  max-width: 1200px;
  margin: 0 auto;
  padding: 24px 24px 0;
}
.search-box {
  background: var(--card-bg);
  border-radius: 20px;
  padding: 24px;
  box-shadow: var(--shadow-lg);
  display: flex;
  gap: 12px;
  align-items: flex-end;
  flex-wrap: wrap;
  border: 2px solid #FFE8E8;
}
.search-field {
  flex: 1;
  min-width: 180px;
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.search-field label {
  font-size: 13px;
  font-weight: 600;
  color: var(--text-secondary);
}
.search-field input, .search-field select {
  padding: 10px 14px;
  border: 1.5px solid var(--border);
  border-radius: var(--radius-sm);
  font-size: 15px;
  outline: none;
  transition: border-color var(--transition);
  background: #fff;
  width: 100%;
}
.search-field input:focus, .search-field select:focus {
  border-color: var(--primary);
  box-shadow: 0 0 0 3px rgba(255,107,107,.12);
}
.search-btn {
  background: linear-gradient(135deg, #FF6B6B, #FF8E8E);
  color: #fff;
  border: none;
  padding: 12px 32px;
  border-radius: 24px;
  font-size: 16px;
  font-weight: 700;
  cursor: pointer;
  transition: all var(--transition);
  white-space: nowrap;
  height: 44px;
  box-shadow: 0 4px 12px rgba(255,107,107,.3);
}
.search-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(255,107,107,.4); }
.search-btn:active { transform: scale(.97); }

/* Autocomplete */
.autocomplete-wrap { position: relative; }
.autocomplete-list {
  position: absolute;
  top: 100%;
  left: 0;
  right: 0;
  background: #fff;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  box-shadow: var(--shadow-lg);
  max-height: 260px;
  overflow-y: auto;
  z-index: 200;
  display: none;
}
.autocomplete-list.show { display: block; }
.ac-item {
  padding: 10px 14px;
  cursor: pointer;
  font-size: 14px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.ac-item:hover, .ac-item.highlighted { background: #FFF0F0; }
.ac-item .ac-country { font-size: 12px; color: var(--text-secondary); }

/* DatePicker */
.datepicker-wrap { position: relative; }
.datepicker-popup {
  position: absolute;
  top: calc(100% + 4px);
  left: 0;
  background: #fff;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow-lg);
  padding: 16px;
  z-index: 200;
  width: 300px;
  display: none;
  animation: fadeIn .15s ease;
}
.datepicker-popup.show { display: block; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: translateY(0); } }
.dp-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 12px;
}
.dp-header span { font-weight: 700; font-size: 15px; }
.dp-nav {
  background: none;
  border: 1px solid var(--border);
  border-radius: 6px;
  width: 32px;
  height: 32px;
  cursor: pointer;
  font-size: 16px;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background var(--transition);
}
.dp-nav:hover { background: #F3F4F6; }
.dp-weekdays {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  text-align: center;
  font-size: 12px;
  font-weight: 600;
  color: var(--text-secondary);
  margin-bottom: 4px;
}
.dp-days {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 2px;
}
.dp-day {
  text-align: center;
  padding: 8px 0;
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  transition: background var(--transition), color var(--transition);
}
.dp-day:hover:not(.disabled):not(.empty) { background: #FFF0F0; }
.dp-day.today { font-weight: 700; color: var(--primary); }
.dp-day.selected { background: var(--primary); color: #fff; font-weight: 700; }
.dp-day.disabled { color: #D1D5DB; cursor: default; }
.dp-day.empty { cursor: default; }
.dp-day.in-range { background: #FFE4E4; }

/* ========== POPULAR DESTINATIONS ========== */
.section-title {
  font-size: 22px;
  font-weight: 800;
  margin: 32px 0 16px;
  color: #4A4A4A;
}
.popular-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
  gap: 12px;
}
.dest-card {
  background: var(--card-bg);
  border-radius: 20px;
  padding: 20px 12px;
  text-align: center;
  cursor: pointer;
  transition: transform var(--transition), box-shadow var(--transition);
  box-shadow: var(--shadow);
  border: 2px solid transparent;
}
.dest-card:hover {
  transform: translateY(-6px) rotate(-1deg);
  box-shadow: var(--shadow-lg);
  border-color: var(--primary-light);
}
.dest-emoji { font-size: 40px; margin-bottom: 8px; }
.dest-name { font-size: 15px; font-weight: 700; color: #4A4A4A; }
.dest-country { font-size: 12px; color: var(--text-secondary); margin-top: 2px; }

/* ========== MAIN LAYOUT ========== */
.main-area {
  max-width: 1200px;
  margin: 0 auto;
  padding: 0 24px 40px;
}
.results-layout {
  display: flex;
  gap: 24px;
  align-items: flex-start;
}

/* Filters sidebar */
.filters-sidebar {
  width: 260px;
  flex-shrink: 0;
  background: var(--card-bg);
  border-radius: var(--radius);
  padding: 20px;
  box-shadow: var(--shadow);
  position: sticky;
  top: 80px;
}
.filter-group { margin-bottom: 20px; }
.filter-group:last-child { margin-bottom: 0; }
.filter-group h4 {
  font-size: 14px;
  font-weight: 700;
  margin-bottom: 10px;
  color: var(--text);
}
.filter-check {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 4px 0;
  font-size: 14px;
  cursor: pointer;
}
.filter-check input[type="checkbox"] { accent-color: var(--primary); width: 16px; height: 16px; }
.price-inputs { display: flex; gap: 8px; align-items: center; }
.price-inputs input {
  width: 100%;
  padding: 8px 10px;
  border: 1.5px solid var(--border);
  border-radius: 6px;
  font-size: 13px;
  outline: none;
}
.price-inputs input:focus { border-color: var(--primary); }
.price-inputs span { color: var(--text-secondary); font-size: 13px; }
.star-filter {
  display: flex;
  gap: 4px;
}
.star-btn {
  background: #F3F4F6;
  border: 1.5px solid var(--border);
  border-radius: 6px;
  padding: 6px 12px;
  font-size: 13px;
  cursor: pointer;
  transition: all var(--transition);
}
.star-btn:hover { border-color: var(--primary-light); }
.star-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }
.filter-apply {
  width: 100%;
  padding: 10px;
  background: var(--primary);
  color: #fff;
  border: none;
  border-radius: var(--radius-sm);
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: background var(--transition);
}
.filter-apply:hover { background: var(--primary-dark); }

/* Results */
.results-main { flex: 1; min-width: 0; }
.results-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 16px;
  flex-wrap: wrap;
  gap: 8px;
}
.results-count { font-size: 15px; color: var(--text-secondary); }
.results-count strong { color: var(--text); }
.sort-select {
  padding: 8px 12px;
  border: 1.5px solid var(--border);
  border-radius: 6px;
  font-size: 14px;
  outline: none;
  background: #fff;
}

/* Hotel card */
.hotel-card {
  background: var(--card-bg);
  border-radius: 20px;
  box-shadow: var(--shadow);
  display: flex;
  overflow: hidden;
  margin-bottom: 16px;
  transition: box-shadow var(--transition), transform var(--transition);
  cursor: pointer;
  border: 2px solid transparent;
}
.hotel-card:hover {
  box-shadow: var(--shadow-lg);
  transform: translateY(-3px);
  border-color: #FFE0E0;
}
.hotel-img {
  width: 260px;
  min-height: 200px;
  flex-shrink: 0;
  position: relative;
  overflow: hidden;
}
.hotel-img img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: transform .3s ease;
}
.hotel-card:hover .hotel-img img { transform: scale(1.05); }
.hotel-type-badge {
  position: absolute;
  top: 12px;
  left: 12px;
  background: rgba(0,0,0,.6);
  color: #fff;
  padding: 4px 10px;
  border-radius: 20px;
  font-size: 12px;
  font-weight: 600;
}
.hotel-info {
  flex: 1;
  padding: 16px 20px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}
.hotel-name {
  font-size: 18px;
  font-weight: 700;
  margin-bottom: 4px;
}
.hotel-addr {
  font-size: 13px;
  color: var(--text-secondary);
  margin-bottom: 6px;
}
.hotel-rating {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-bottom: 8px;
}
.rating-badge {
  background: linear-gradient(135deg, #FF6B6B, #FF8E8E);
  color: #fff;
  padding: 3px 10px;
  border-radius: 12px;
  font-size: 13px;
  font-weight: 700;
}
.review-count { font-size: 12px; color: var(--text-secondary); }
.hotel-amenities {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
  margin-bottom: 10px;
}
.amenity-tag {
  background: #FFF0F0;
  color: #FF6B6B;
  padding: 4px 10px;
  border-radius: 12px;
  font-size: 11px;
  font-weight: 600;
}
.hotel-desc {
  font-size: 13px;
  color: var(--text-secondary);
  margin-bottom: 8px;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.hotel-price-section {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  margin-top: auto;
  padding-top: 12px;
  border-top: 1px solid var(--border);
}
.price-left {}
.lowest-label { font-size: 12px; color: var(--text-secondary); }
.lowest-price {
  font-size: 24px;
  font-weight: 800;
  color: var(--primary);
}
.lowest-provider { font-size: 12px; color: var(--text-secondary); }
.price-compare-btn {
  background: #fff;
  border: 1.5px solid var(--primary);
  color: var(--primary);
  padding: 8px 16px;
  border-radius: var(--radius-sm);
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: all var(--transition);
}
.price-compare-btn:hover {
  background: var(--primary);
  color: #fff;
}

/* ========== MODAL ========== */
.modal-overlay {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: rgba(0,0,0,.5);
  z-index: 500;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  visibility: hidden;
  transition: opacity .2s, visibility .2s;
}
.modal-overlay.show { opacity: 1; visibility: visible; }
.modal {
  background: var(--card-bg);
  border-radius: var(--radius);
  width: 560px;
  max-width: 95vw;
  max-height: 90vh;
  overflow-y: auto;
  box-shadow: 0 25px 50px rgba(0,0,0,.25);
  transform: scale(.95);
  transition: transform .2s;
}
.modal-overlay.show .modal { transform: scale(1); }
.modal-header {
  padding: 20px 24px;
  border-bottom: 1px solid var(--border);
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
}
.modal-hotel-name { font-size: 18px; font-weight: 700; }
.modal-hotel-dest { font-size: 13px; color: var(--text-secondary); margin-top: 2px; }
.modal-close {
  background: none;
  border: none;
  font-size: 24px;
  cursor: pointer;
  color: var(--text-secondary);
  padding: 0 4px;
  line-height: 1;
}
.modal-close:hover { color: var(--text); }
.modal-body { padding: 20px 24px; }
.modal-dates {
  font-size: 14px;
  color: var(--text-secondary);
  margin-bottom: 16px;
  display: flex;
  gap: 12px;
}
.ota-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 16px;
  border: 1.5px solid var(--border);
  border-radius: var(--radius-sm);
  margin-bottom: 8px;
  transition: border-color var(--transition);
}
.ota-row:hover { border-color: var(--primary-light); }
.ota-row.cheapest { border-color: var(--primary); background: #FFF5F5; }
.ota-left { display: flex; align-items: center; gap: 12px; }
.ota-dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  flex-shrink: 0;
}
.ota-name { font-weight: 600; font-size: 15px; }
.cheapest-badge {
  background: linear-gradient(135deg, #FF6B6B, #FF8E8E);
  color: #fff;
  font-size: 11px;
  padding: 3px 10px;
  border-radius: 12px;
  font-weight: 700;
}
.ota-right { display: flex; align-items: center; gap: 16px; }
.ota-prices { text-align: right; }
.ota-original {
  font-size: 12px;
  color: #9CA3AF;
  text-decoration: line-through;
}
.ota-current {
  font-size: 18px;
  font-weight: 700;
  color: var(--text);
}
.ota-row.cheapest .ota-current { color: var(--primary); }
.ota-total { font-size: 11px; color: var(--text-secondary); }
.ota-book {
  padding: 8px 16px;
  border-radius: 6px;
  font-size: 13px;
  font-weight: 600;
  color: #fff;
  border: none;
  cursor: pointer;
  white-space: nowrap;
  transition: opacity var(--transition);
}
.ota-book:hover { opacity: .9; }

/* Unavailable message */
.ota-unavailable {
  padding: 14px 16px;
  border: 1.5px dashed #D1D5DB;
  border-radius: var(--radius-sm);
  margin-bottom: 8px;
  display: flex;
  align-items: center;
  gap: 12px;
  color: #9CA3AF;
  font-size: 14px;
}

/* Loading spinner */
.spinner {
  display: inline-block;
  width: 20px;
  height: 20px;
  border: 2.5px solid #E5E7EB;
  border-top-color: var(--primary);
  border-radius: 50%;
  animation: spin .6s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.loading-overlay {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 16px;
  padding: 60px 0;
  color: var(--text-secondary);
  font-size: 15px;
}
.loading-overlay .spinner { width: 36px; height: 36px; }

/* No results */
.no-results {
  text-align: center;
  padding: 60px 20px;
  color: var(--text-secondary);
}
.no-results-icon { font-size: 48px; margin-bottom: 16px; }
.no-results h3 { font-size: 18px; color: var(--text); margin-bottom: 8px; }

/* ========== FOOTER ========== */
.footer {
  background: linear-gradient(135deg, #FFE0E0 0%, #FFF0E0 50%, #E0F5EC 100%);
  color: #8E7A7A;
  text-align: center;
  padding: 28px;
  font-size: 13px;
  margin-top: 40px;
  border-top: 2px dashed #FFD4D4;
}
.footer a { color: var(--primary); }

/* ========== RESPONSIVE ========== */
@media (max-width: 900px) {
  .results-layout { flex-direction: column; }
  .filters-sidebar { width: 100%; position: static; }
  .hotel-img { width: 200px; }
}
@media (max-width: 600px) {
  .header-inner { padding: 12px 16px 0; }
  .logo { font-size: 22px; }
  .logo-emoji { font-size: 24px; }
  .tab-bar { padding: 8px 16px 0; }
  .search-section { padding: 16px 16px 0; }
  .search-box { flex-direction: column; padding: 16px; }
  .search-field { min-width: 100%; }
  .search-btn { width: 100%; }
  .main-area { padding: 0 16px 32px; }
  .hotel-card { flex-direction: column; }
  .hotel-img { width: 100%; min-height: 180px; max-height: 200px; }
  .popular-grid { grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 8px; }
  .dest-card { padding: 14px 8px; }
  .dest-emoji { font-size: 28px; }
  .modal { width: 100%; max-width: 100vw; border-radius: 16px 16px 0 0; position: fixed; bottom: 0; max-height: 85vh; }
  .datepicker-popup { left: -40px; }
}
</style>
</head>
<body>

<!-- Header -->
<header class="header">
  <div class="header-inner">
    <div>
      <div class="logo"><span class="logo-emoji">&#x2708;&#xFE0F;</span> 여행가자<span>!</span></div>
      <div class="header-sub">최저가 숙소를 한눈에 비교하세요</div>
    </div>
  </div>
  <div class="tab-bar">
    <button class="tab-btn active" data-tab="domestic">국내</button>
    <button class="tab-btn" data-tab="international">해외</button>
  </div>
</header>

<!-- Search -->
<section class="search-section">
  <div class="search-box">
    <div class="search-field" style="flex:1.5;">
      <label>여행지</label>
      <div class="autocomplete-wrap">
        <input type="text" id="destInput" placeholder="도시명을 입력하세요" autocomplete="off">
        <div class="autocomplete-list" id="acList"></div>
      </div>
    </div>
    <div class="search-field">
      <label>체크인</label>
      <div class="datepicker-wrap">
        <input type="text" id="checkinInput" placeholder="날짜 선택" readonly>
        <div class="datepicker-popup" id="checkinPicker"></div>
      </div>
    </div>
    <div class="search-field">
      <label>체크아웃</label>
      <div class="datepicker-wrap">
        <input type="text" id="checkoutInput" placeholder="날짜 선택" readonly>
        <div class="datepicker-popup" id="checkoutPicker"></div>
      </div>
    </div>
    <div class="search-field" style="flex:.6;min-width:100px;">
      <label>인원</label>
      <select id="guestSelect">
        <option value="1">1명</option>
        <option value="2" selected>2명</option>
        <option value="3">3명</option>
        <option value="4">4명</option>
        <option value="5+">5명+</option>
      </select>
    </div>
    <button class="search-btn" id="searchBtn">검색</button>
  </div>
</section>

<!-- Main content -->
<div class="main-area">
  <!-- Popular destinations -->

// ====================== UTILITY FUNCTIONS ======================

function simpleHash(str) {
  let hash = 0;
  for (let i = 0; i < str.length; i++) {
    const char = str.charCodeAt(i);
    hash = ((hash << 5) - hash) + char;
    hash = hash & hash;
  }
  return Math.abs(hash);
}

function seededRandom(seed) {
  let s = seed;
  return function() {
    s = (s * 1664525 + 1013904223) & 0xFFFFFFFF;
    return (s >>> 0) / 0xFFFFFFFF;
  };
}

function bookingUrl(provider, hotelName, destination, checkin, checkout) {
  const name = encodeURIComponent(hotelName);
  const dest = encodeURIComponent(destination);
  switch (provider) {
    case "야놀자": return `https://www.yanolja.com/search/${name}`;
    case "여기어때": return `https://www.goodchoice.kr/product/search/2?keyword=${name}`;
    case "부킹닷컴": return `https://www.booking.com/searchresults.ko.html?ss=${name}&checkin=${checkin}&checkout=${checkout}`;
    case "아고다": return `https://www.agoda.com/ko-kr/search?textToSearch=${name}&checkIn=${checkin}&checkOut=${checkout}`;
    case "호텔스닷컴": return `https://kr.hotels.com/search.do?q-destination=${name}&q-check-in=${checkin}&q-check-out=${checkout}`;
    case "트립닷컴": return `https://kr.trip.com/hotels/list?keyword=${name}&city=${dest}&checkin=${checkin}&checkout=${checkout}`;
    default: return `https://www.google.com/search?q=${name}+${dest}+호텔+예약`;
  }
}

function generatePrices(hotel, checkin, checkout) {
  const results = [];
  for (const ota of OTA_PROVIDERS) {
    const seed = simpleHash(`${hotel.id}:${ota.name}:${checkin}`);
    const rng = seededRandom(seed);
    const variation = 0.82 + rng() * 0.36;
    const price = Math.round(hotel.base_price * variation / 1000) * 1000;
    const hasDiscount = rng() < 0.35;
    const originalPrice = hasDiscount ? Math.round(price * (1.1 + rng() * 0.2) / 1000) * 1000 : null;
    const available = rng() < 0.88;
    if (!available) continue;
    results.push({
      provider: ota.name,
      price,
      original_price: originalPrice,
      url: bookingUrl(ota.name, hotel.name, hotel.destination, checkin, checkout),
    });
  }
  return results.sort((a, b) => a.price - b.price);
}

function searchHotels(params) {
  let candidates = HOTELS.filter(h => h.destination === params.destination);
  if (!candidates.length) {
    candidates = HOTELS.filter(h =>
      params.destination.toLowerCase().includes(h.destination.toLowerCase()) ||
      h.name.toLowerCase().includes(params.destination.toLowerCase())
    );
  }
  if (params.hotel_type && params.hotel_type.length) {
    candidates = candidates.filter(h => params.hotel_type.includes(h.hotel_type));
  }
  if (params.min_rating) candidates = candidates.filter(h => h.rating >= params.min_rating);

  const d1 = new Date(params.checkin), d2 = new Date(params.checkout);
  const nights = Math.max(Math.round((d2 - d1) / (1000 * 60 * 60 * 24)), 1);

  const results = [];
  for (const h of candidates) {
    const prices = generatePrices(h, params.checkin, params.checkout);
    if (!prices.length) continue;
    const lowest = prices[0];
    if (params.min_price && lowest.price * nights < params.min_price) continue;
    if (params.max_price && lowest.price * nights > params.max_price) continue;
    results.push({
      ...h,
      prices,
      lowest_price: lowest.price,
      lowest_provider: lowest.provider,
    });
  }

  const sortFn = {
    price: (a, b) => a.lowest_price - b.lowest_price,
    rating: (a, b) => b.rating - a.rating,
    name: (a, b) => a.name.localeCompare(b.name),
  }[params.sort_by] || ((a, b) => a.lowest_price - b.lowest_price);
  results.sort(sortFn);

  return { results, total: results.length, destination: params.destination, checkin: params.checkin, checkout: params.checkout, nights };
}

  return n.toLocaleString('ko-KR') + '원';

// ====================== DATE PICKER ======================
class DatePicker {
  constructor(inputEl, popupEl, opts = {}) {
    this.input = inputEl;
    this.popup = popupEl;
    this.minDate = opts.minDate || null;
    this.onSelect = opts.onSelect || (() => {});
    this.selected = null;
    this.viewYear = new Date().getFullYear();
    this.viewMonth = new Date().getMonth();
    this.input.addEventListener('click', (e) => {
      e.stopPropagation();
      this.open();
    });
    this.popup.addEventListener('click', (e) => e.stopPropagation());
    this.render();
  }
  open() {
    document.querySelectorAll('.datepicker-popup.show').forEach(p => p.classList.remove('show'));
    this.popup.classList.add('show');
  }
  close() { this.popup.classList.remove('show'); }
  setMinDate(d) { this.minDate = d; this.render(); }
  render() {
    const y = this.viewYear, m = this.viewMonth;
    const firstDay = new Date(y, m, 1).getDay();
    const daysInMonth = new Date(y, m + 1, 0).getDate();
    const today = new Date(); today.setHours(0,0,0,0);
    const monthNames = ['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'];

    let html = `<div class="dp-header">
      <button class="dp-nav" data-dir="-1">&larr;</button>
      <span>${y}년 ${monthNames[m]}</span>
      <button class="dp-nav" data-dir="1">&rarr;</button>
    </div>
    <div class="dp-weekdays"><div>일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div>토</div></div>
    <div class="dp-days">`;

    for (let i = 0; i < firstDay; i++) html += '<div class="dp-day empty"></div>';
    for (let d = 1; d <= daysInMonth; d++) {
      const date = new Date(y, m, d);
      const iso = this.toISO(date);
      let cls = 'dp-day';
      const isToday = date.getTime() === today.getTime();
      const isSelected = this.selected && iso === this.selected;
      const isDisabled = (this.minDate && date < new Date(this.minDate)) || date < today;
      if (isToday) cls += ' today';
      if (isSelected) cls += ' selected';
      if (isDisabled) cls += ' disabled';
      html += `<div class="${cls}" data-date="${iso}">${d}</div>`;
    }
    html += '</div>';
    this.popup.innerHTML = html;

    this.popup.querySelectorAll('.dp-nav').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const dir = parseInt(btn.dataset.dir);
        this.viewMonth += dir;
        if (this.viewMonth < 0) { this.viewMonth = 11; this.viewYear--; }
        if (this.viewMonth > 11) { this.viewMonth = 0; this.viewYear++; }
        this.render();
      });
    });
    this.popup.querySelectorAll('.dp-day:not(.disabled):not(.empty)').forEach(day => {
      day.addEventListener('click', (e) => {
        e.stopPropagation();
        this.selected = day.dataset.date;
        this.input.value = this.selected;
        this.render();
        this.close();
        this.onSelect(this.selected);
      });
    });
  }
  toISO(d) {
    const yy = d.getFullYear();
    const mm = String(d.getMonth()+1).padStart(2,'0');
    const dd = String(d.getDate()).padStart(2,'0');
    return `${yy}-${mm}-${dd}`;
  }
}

// ====================== INIT ======================
document.addEventListener('DOMContentLoaded', () => {
  // Set default dates: tomorrow / day after tomorrow
  const tomorrow = new Date();
  tomorrow.setDate(tomorrow.getDate() + 1);
  const dayAfter = new Date();
  dayAfter.setDate(dayAfter.getDate() + 2);

  const checkinPicker = new DatePicker(
    document.getElementById('checkinInput'),
    document.getElementById('checkinPicker'),
    {
      onSelect(date) {
        selectedCheckin = date;
        const next = new Date(date);
        next.setDate(next.getDate() + 1);
        checkoutPicker.setMinDate(date);
        if (!selectedCheckout || new Date(selectedCheckout) <= new Date(date)) {
          const nextISO = checkoutPicker.toISO(next);
          checkoutPicker.selected = nextISO;
          checkoutPicker.input.value = nextISO;
          selectedCheckout = nextISO;
          checkoutPicker.viewYear = next.getFullYear();
          checkoutPicker.viewMonth = next.getMonth();
          checkoutPicker.render();
        }
      }
    }
  );

  const checkoutPicker = new DatePicker(
    document.getElementById('checkoutInput'),
    document.getElementById('checkoutPicker'),
    {
      onSelect(date) { selectedCheckout = date; }
    }
  );

  // Set defaults
  checkinPicker.selected = checkinPicker.toISO(tomorrow);
  checkinPicker.input.value = checkinPicker.selected;
  selectedCheckin = checkinPicker.selected;
  checkoutPicker.selected = checkoutPicker.toISO(dayAfter);
  checkoutPicker.input.value = checkoutPicker.selected;
  selectedCheckout = checkoutPicker.selected;
  checkoutPicker.setMinDate(checkinPicker.selected);

  // Close datepickers on outside click
  document.addEventListener('click', () => {
    document.querySelectorAll('.datepicker-popup.show').forEach(p => p.classList.remove('show'));
    document.getElementById('acList').classList.remove('show');
  });

  // Tab switching
  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentTab = btn.dataset.tab;
      document.getElementById('destInput').value = '';
      showPopularDestinations();
      document.getElementById('resultsSection').style.display = 'none';
      document.getElementById('popularSection').style.display = '';
    });
  });

  // Autocomplete
  const destInput = document.getElementById('destInput');
  const acList = document.getElementById('acList');
  let acHighlight = -1;

  destInput.addEventListener('input', () => {
    const val = destInput.value.trim().toLowerCase();
    acHighlight = -1;
    if (!val) { acList.classList.remove('show'); return; }
    const matches = DESTINATIONS.filter(d =>
      d.category === currentTab &&
      (d.name.toLowerCase().includes(val) || d.name_en.toLowerCase().includes(val))
    ).slice(0, 10);
    if (!matches.length) { acList.classList.remove('show'); return; }
    acList.innerHTML = matches.map((d, i) =>
      `<div class="ac-item" data-name="${d.name}" data-idx="${i}">
        <span>${DEST_EMOJI[d.name] || ''} ${d.name} (${d.name_en})</span>
        <span class="ac-country">${d.country}</span>
      </div>`
    ).join('');
    acList.classList.add('show');
    acList.querySelectorAll('.ac-item').forEach(item => {
      item.addEventListener('click', (e) => {
        e.stopPropagation();
        destInput.value = item.dataset.name;
        acList.classList.remove('show');
      });
    });
  });

  destInput.addEventListener('keydown', (e) => {
    const items = acList.querySelectorAll('.ac-item');
    if (!items.length) return;
    if (e.key === 'ArrowDown') { e.preventDefault(); acHighlight = Math.min(acHighlight + 1, items.length - 1); updateAcHighlight(items); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); acHighlight = Math.max(acHighlight - 1, 0); updateAcHighlight(items); }
    else if (e.key === 'Enter' && acHighlight >= 0) { e.preventDefault(); destInput.value = items[acHighlight].dataset.name; acList.classList.remove('show'); }
  });

  destInput.addEventListener('click', (e) => e.stopPropagation());
  acList.addEventListener('click', (e) => e.stopPropagation());

  function updateAcHighlight(items) {
    items.forEach((it, i) => it.classList.toggle('highlighted', i === acHighlight));
  }

  // Search
  document.getElementById('searchBtn').addEventListener('click', doSearch);
  destInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && acHighlight < 0) doSearch();
  });

  // Sort
  document.getElementById('sortSelect').addEventListener('change', () => {
    if (currentSearchResult) renderResults(currentSearchResult);
  });

  // Filter apply
  document.getElementById('filterApplyBtn').addEventListener('click', doSearch);

  // Star filter buttons
  document.querySelectorAll('.star-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.star-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      filterRating = parseFloat(btn.dataset.rating) || 0;
    });
  });
  // Fix initial star filter state
  document.querySelectorAll('.star-btn').forEach(btn => {
    btn.classList.remove('active');
    if (btn.dataset.rating === '0' && btn.textContent === '전체') btn.classList.add('active');
  });
  filterRating = 0;

  // Modal close
  document.getElementById('modalOverlay').addEventListener('click', (e) => {
    if (e.target === document.getElementById('modalOverlay')) closeModal();
  });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });

  // Restore state from URL hash (if shared link)
  const urlState = loadStateFromURL();
  if (urlState) {
    document.getElementById('destInput').value = urlState.dest;
    selectedCheckin = urlState.in;
    selectedCheckout = urlState.out;
    checkinPicker.selected = urlState.in;
    checkinPicker.input.value = urlState.in;
    checkoutPicker.selected = urlState.out;
    checkoutPicker.input.value = urlState.out;
    checkoutPicker.setMinDate(urlState.in);
    if (urlState.guests) document.getElementById('guestSelect').value = urlState.guests;
    const destCat = DESTINATIONS.find(d => d.name === urlState.dest);
    if (destCat && destCat.category === 'international') {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelector('.tab-btn[data-tab="international"]').classList.add('active');
      currentTab = 'international';
    }
    doSearch();
  } else {
    showPopularDestinations();
  }
});

// ====================== URL STATE ======================
function saveStateToURL() {
  const dest = document.getElementById('destInput').value.trim();
  if (!dest || !selectedCheckin || !selectedCheckout) return;
  const guests = document.getElementById('guestSelect').value;
  const hash = `#dest=${encodeURIComponent(dest)}&in=${selectedCheckin}&out=${selectedCheckout}&guests=${guests}`;
  history.replaceState(null, '', hash);
}

function loadStateFromURL() {
  const hash = location.hash.slice(1);
  if (!hash) return null;
  const p = {};
  hash.split('&').forEach(kv => { const [k,v] = kv.split('='); if (k && v) p[k] = decodeURIComponent(v); });
  if (p.dest && p.in && p.out) return p;
  return null;
}

// ====================== SEARCH ======================
function doSearch() {
  const dest = document.getElementById('destInput').value.trim();
  if (!dest) { alert('여행지를 입력해주세요.'); return; }
  if (!selectedCheckin || !selectedCheckout) { alert('체크인/체크아웃 날짜를 선택해주세요.'); return; }

  saveStateToURL();

  // Gather filters
  const typeChecks = document.querySelectorAll('.filter-group input[type="checkbox"]');
  const types = [];
  typeChecks.forEach(c => { if (c.checked) types.push(c.value); });
  const minPrice = parseInt(document.getElementById('filterMinPrice').value) || 0;
  const maxPrice = parseInt(document.getElementById('filterMaxPrice').value) || 0;

  document.getElementById('popularSection').style.display = 'none';
  document.getElementById('resultsSection').style.display = '';

  // Show loading
  document.getElementById('hotelList').innerHTML = `
    <div class="loading-overlay">
      <div class="spinner"></div>
      <div>숙소를 검색하고 있습니다...</div>
    </div>`;
  document.getElementById('resultsCount').textContent = '';

  setTimeout(() => {
    const params = {
      destination: dest,
      checkin: selectedCheckin,
      checkout: selectedCheckout,
      hotel_type: types.length ? types : null,
      min_rating: filterRating || null,
      min_price: minPrice || null,
      max_price: maxPrice || null,
      sort_by: document.getElementById('sortSelect').value,
    };
    const data = searchHotels(params);
    currentSearchResult = data;
    renderResults(data);
  }, 300);
}

// ====================== RENDER RESULTS ======================
function renderResults(data) {
  const sortBy = document.getElementById('sortSelect').value;
  const sortFn = {
    price: (a, b) => a.lowest_price - b.lowest_price,
    rating: (a, b) => b.rating - a.rating,
    name: (a, b) => a.name.localeCompare(b.name),
  }[sortBy] || ((a, b) => a.lowest_price - b.lowest_price);
  data.results.sort(sortFn);

  const list = document.getElementById('hotelList');
  document.getElementById('resultsCount').innerHTML =
    `<strong>${data.destination}</strong> ${data.checkin} ~ ${data.checkout} (${data.nights}박) &middot; <strong>${data.total}개</strong> 숙소`;

  if (!data.results.length) {
    list.innerHTML = `<div class="no-results">
      <div class="no-results-icon">🔍</div>
      <h3>검색 결과가 없습니다</h3>
      <p>다른 여행지나 조건으로 검색해 보세요.</p>
    </div>`;
    return;
  }

  list.innerHTML = data.results.map(h => {
    const typeLabel = HOTEL_TYPE_KR[h.hotel_type] || h.hotel_type;
    return `<div class="hotel-card" data-id="${h.id}">
      <div class="hotel-img">
        <img src="${imgUrl(h.image)}" alt="${h.name}" onerror="this.src='${FALLBACK_IMG}';" loading="lazy">
        <div class="hotel-type-badge">${typeLabel}</div>
      </div>
      <div class="hotel-info">
        <div>
          <div class="hotel-name">${h.name}</div>
          <div class="hotel-addr">${h.address}</div>
          <div class="hotel-rating">
            <span class="rating-badge">${h.rating}</span>
            <span class="review-count">리뷰 ${h.review_count.toLocaleString()}개</span>
          </div>
          <div class="hotel-amenities">
            ${h.amenities.slice(0, 5).map(a => `<span class="amenity-tag">${a}</span>`).join('')}
          </div>
          <div class="hotel-desc">${h.description}</div>
        </div>
        <div class="hotel-price-section">
          <div class="price-left">
            <div class="lowest-label">최저가 (1박)</div>
            <div class="lowest-price">${formatPrice(h.lowest_price)}</div>
            <div class="lowest-provider">${h.lowest_provider}</div>
          </div>
          <button class="price-compare-btn" data-id="${h.id}">가격비교 ${h.prices.length}개</button>
        </div>
      </div>
    </div>`;
  }).join('');

  // Card clicks
  list.querySelectorAll('.hotel-card').forEach(card => {
    card.addEventListener('click', (e) => {
      if (e.target.closest('.price-compare-btn')) return;
      const hid = card.dataset.id;
      const hotel = data.results.find(h => h.id === hid);
      if (hotel) openModal(hotel, data);
    });
  });
  list.querySelectorAll('.price-compare-btn').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const hid = btn.dataset.id;
      const hotel = data.results.find(h => h.id === hid);
      if (hotel) openModal(hotel, data);
    });
  });
}

// ====================== MODAL ======================
function openModal(hotel, searchData) {
  const nights = searchData.nights;
  const allProviders = OTA_PROVIDERS.map(ota => {
    const found = hotel.prices.find(p => p.provider === ota.name);
    return found ? { ...found, available: true, color: ota.color } : { provider: ota.name, available: false, color: ota.color };
  });

  const content = document.getElementById('modalContent');
  content.innerHTML = `
    <div class="modal-header">
      <div>
        <div class="modal-hotel-name">${hotel.name}</div>
        <div class="modal-hotel-dest">${hotel.destination} &middot; ${HOTEL_TYPE_KR[hotel.hotel_type] || hotel.hotel_type} &middot; ${hotel.rating}점</div>
      </div>
      <button class="modal-close" id="modalCloseBtn">&times;</button>
    </div>
    <div class="modal-body">
      <div class="modal-dates">
        <span>체크인: ${searchData.checkin}</span>
        <span>체크아웃: ${searchData.checkout}</span>
        <span>${nights}박</span>
      </div>
      ${allProviders.map((p, i) => {
        if (!p.available) {
          return `<div class="ota-unavailable">
            <div class="ota-dot" style="background:${p.color}"></div>
            <span>${p.provider} - 예약 불가</span>
          </div>`;
        }
        const isCheapest = i === 0 || p.price === allProviders.filter(x=>x.available)[0].price;
        const total = p.price * nights;
        return `<div class="ota-row${isCheapest && p === allProviders.filter(x=>x.available)[0] ? ' cheapest' : ''}">
          <div class="ota-left">
            <div class="ota-dot" style="background:${p.color}"></div>
            <span class="ota-name">${p.provider}</span>
            ${isCheapest && p === allProviders.filter(x=>x.available)[0] ? '<span class="cheapest-badge">최저가</span>' : ''}
          </div>
          <div class="ota-right">
            <div class="ota-prices">
              ${p.original_price ? `<div class="ota-original">${formatPrice(p.original_price)}</div>` : ''}
              <div class="ota-current">${formatPrice(p.price)}</div>
              ${nights > 1 ? `<div class="ota-total">${nights}박 합계 ${formatPrice(total)}</div>` : ''}
            </div>
            <a href="${p.url}" target="_blank" rel="noopener" class="ota-book" style="background:${p.color}">예약하기 &rarr;</a>
          </div>
        </div>`;
      }).join('')}
    </div>`;

  document.getElementById('modalCloseBtn').addEventListener('click', closeModal);
  document.getElementById('modalOverlay').classList.add('show');
  document.body.style.overflow = 'hidden';
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('show');
  document.body.style.overflow = '';
}
</script>
</body>
</html>
